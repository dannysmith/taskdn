# Dependabot. Bigger updates happen in deliberate sessions with the
# deps-update skill (.claude/skills/deps-update/); this keeps the gaps small.
#
# - bun: Dependabot can't open security-fix PRs for bun, only version updates.
#   So each bun project gets one grouped PR a month with its minor and patch
#   updates, which is how fixes arrive. Majors are left for deps-update.
# - cargo: security-fix PRs only (open-pull-requests-limit: 0 turns off
#   version updates).
# - GitHub Actions: one grouped PR a month.
#
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2

updates:
  # One PR per project (each directory is updated separately)
  - package-ecosystem: 'bun'
    directories:
      - '/tdn-cli'
      - '/tdn-desktop'
      - '/website'
    schedule:
      interval: 'monthly'
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'cargo'
    directories:
      - '/tdn-cli'
      - '/tdn-desktop/src-tauri'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
