name: 'Release Taskdn Desktop'

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # desktop-v1.0.0 from a tag push, or built from the workflow_dispatch input
  RELEASE_TAG: ${{ inputs.version && format('desktop-v{0}', inputs.version) || github.ref_name }}

jobs:
  # Create a single draft release up front so the parallel build matrix all
  # uploads to one shared release. Without this, each matrix job runs
  # find-or-create and a tauri-action race (issue #914) can split assets
  # across multiple drafts, each with an incomplete latest.json.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = process.env.RELEASE_TAG
            const version = tag.replace(/^desktop-v/, '')
            const { owner, repo } = context.repo
            // Write the release notes in the draft before publishing. Publishing
            // fires publish-release-notes.yml, which copies them to the website.
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `Taskdn Desktop v${version}`,
              body: `## Taskdn Desktop v${version}\n`,
              draft: true,
              prerelease: false,
            })
            return data.id

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-26'
            args: '--target universal-apple-darwin --bundles app,dmg'
          - platform: 'windows-latest'
            args: '--bundles msi'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage'

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: tdn-desktop

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets for universal binary
        if: matrix.platform == 'macos-26'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      # No Rust cache: releases build cold. They can't restore ci-desktop.yml's
      # cache (different job and profile), and tag-scoped caches are never read
      # again.

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Import Code-Signing Certificates
        if: matrix.platform == 'macos-26'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Create API Key file
        if: matrix.platform == 'macos-26'
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_KEY_PATH }}" > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8

      - name: Build and release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing (macOS only - ignored on other platforms)
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: Daniel Smith (XT349SJG9U)'
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: tdn-desktop
          # Upload to the shared draft from create-release instead of
          # finding-or-creating per matrix job. The release name, body and
          # draft state are set there.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  # Stable-named installer copies for the website's download links. The tag is
  # worked out again here because reusable workflow inputs can't read `env`.
  stable-assets:
    needs: publish-tauri
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-stable-assets.yml
    with:
      tag: ${{ inputs.version && format('desktop-v{0}', inputs.version) || github.ref_name }}
