name: 'Release Taskdn Desktop'

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # desktop-v1.0.0 from a tag push, or built from the workflow_dispatch input
  RELEASE_TAG: ${{ inputs.version && format('desktop-v{0}', inputs.version) || github.ref_name }}

jobs:
  # Create a single draft release up front so the parallel build matrix all
  # uploads to one shared release. Without this, each matrix job runs
  # find-or-create and a tauri-action race (issue #914) can split assets
  # across multiple drafts, each with an incomplete latest.json.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = process.env.RELEASE_TAG
            const version = tag.replace(/^desktop-v/, '')
            const { owner, repo } = context.repo
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `Taskdn Desktop v${version}`,
              body: [
                `## Taskdn Desktop v${version}`,
                '',
                '### Installation Instructions',
                '- **macOS**: Download the `.dmg` file and drag to Applications folder',
                '- **Windows**: Download the `.msi` file and run the installer',
                '- **Linux**: Download the `.AppImage` file, make it executable (`chmod +x`), and run',
                '',
                '### Auto-Updates',
                'Existing users will receive automatic update notifications.',
                '',
                `**Full Changelog**: https://github.com/${owner}/${repo}/commits/${tag}`,
              ].join('\n'),
              draft: true,
              prerelease: false,
            })
            return data.id

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-26'
            args: '--target universal-apple-darwin --bundles app,dmg'
          - platform: 'windows-latest'
            args: '--bundles msi'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage'

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: tdn-desktop

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets for universal binary
        if: matrix.platform == 'macos-26'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './tdn-desktop/src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Import Code-Signing Certificates
        if: matrix.platform == 'macos-26'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Create API Key file
        if: matrix.platform == 'macos-26'
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_KEY_PATH }}" > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8

      - name: Build and release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing (macOS only - ignored on other platforms)
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: Daniel Smith (XT349SJG9U)'
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: tdn-desktop
          # Upload to the shared draft from create-release instead of
          # finding-or-creating per matrix job. The release name, body and
          # draft state are set there.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Upload macOS artifact for website
        if: matrix.platform == 'macos-26'
        uses: actions/upload-artifact@v7
        with:
          name: website-macos
          path: tdn-desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload Windows artifact for website
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: website-windows
          path: tdn-desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Linux artifact for website
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: website-linux
          path: tdn-desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  # Collect all artifacts and commit to website folder
  update-website:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: website-macos
          path: /tmp/artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: website-windows
          path: /tmp/artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: website-linux
          path: /tmp/artifacts

      - name: Copy artifacts to website folder
        run: |
          echo "Available artifacts:"
          ls -la /tmp/artifacts/

          # Copy macOS DMG
          DMG_FILE=$(find /tmp/artifacts -name "*.dmg" | head -1)
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" website/public/taskdn-desktop-latest.dmg
            echo "✓ Copied DMG: $DMG_FILE"
          fi

          # Copy Windows MSI
          MSI_FILE=$(find /tmp/artifacts -name "*.msi" | head -1)
          if [ -n "$MSI_FILE" ]; then
            cp "$MSI_FILE" website/public/taskdn-desktop-latest.msi
            echo "✓ Copied MSI: $MSI_FILE"
          fi

          # Copy Linux AppImage
          APPIMAGE_FILE=$(find /tmp/artifacts -name "*.AppImage" | head -1)
          if [ -n "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" website/public/taskdn-desktop-latest.AppImage
            echo "✓ Copied AppImage: $APPIMAGE_FILE"
          fi

          echo "Website public folder contents:"
          ls -la website/public/*.dmg website/public/*.msi website/public/*.AppImage 2>/dev/null || true

      - name: Commit website artifacts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add website/public/taskdn-desktop-latest.dmg website/public/taskdn-desktop-latest.msi website/public/taskdn-desktop-latest.AppImage
          git commit -m "chore(website): update desktop installers for $RELEASE_TAG" || echo "No changes to commit"
          git push origin main || echo "Failed to push, continuing..."

  deploy-website:
    needs: update-website
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger website deploy
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-website.yml',
              ref: 'main'
            })
