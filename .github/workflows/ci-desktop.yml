name: CI - Desktop

# Checks and a build on each platform for every PR and push to main that
# touches the desktop app. Only main saves the Rust cache; PRs restore it (PRs
# can't read each other's caches).

on:
  push:
    branches: [main]
    paths:
      - 'tdn-desktop/**'
      - '.github/workflows/ci-desktop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tdn-desktop/**'
      - '.github/workflows/ci-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: tdn-desktop

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    concurrency:
      group: ci-desktop-${{ github.event.pull_request.number || github.ref }}-checks
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # No debug info: faster test builds and a smaller cache. Failing tests still
    # report file:line, but backtraces lose line numbers.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # Vitest still runs on Node
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './tdn-desktop/src-tauri -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check:all

  build:
    concurrency:
      group: ci-desktop-${{ github.event.pull_request.number || github.ref }}-${{ matrix.platform }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native arm64 only; release-desktop.yml builds the universal binary
          - platform: 'macos-26'
            args: '--bundles app'
          - platform: 'windows-latest'
            args: '--bundles msi'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    # Skip LTO and allow parallel codegen to cut build time. Release builds keep
    # the Cargo.toml profile. Not `--debug`, which would compile dev-only code.
    env:
      CARGO_PROFILE_RELEASE_LTO: false
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # The Tauri CLI still runs on Node
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './tdn-desktop/src-tauri -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Tauri build
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tdn-desktop
          args: ${{ matrix.args }}

      # A build that compiles can still crash at startup, so launch it and fail
      # if it exits within 20s.
      - name: Smoke test (app starts)
        if: matrix.platform == 'windows-latest'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/taskdn-desktop.exe'
          if (-not (Test-Path $exe)) { throw "Built app not found at $exe" }
          $app = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardOutput smoke-stdout.log -RedirectStandardError smoke-stderr.log
          $null = $app.Handle # without this, ExitCode is empty after the process exits
          $exited = $app.WaitForExit(20000)
          if (-not $exited) { Stop-Process -Id $app.Id -Force; $app.WaitForExit() }
          Get-Content smoke-stdout.log, smoke-stderr.log -ErrorAction SilentlyContinue
          if ($exited) { throw "The app exited during startup with code $($app.ExitCode)" }
          Write-Output 'The app was still running after 20s'
