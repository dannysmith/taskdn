name: CI - Website

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/ci-website.yml'
  workflow_dispatch:

concurrency:
  group: ci-website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      # Astro 7 needs Node 22.23.4+
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (astro check, tsc, ESLint, Prettier)
        run: bun run check

      - name: Build
        run: bun run build
